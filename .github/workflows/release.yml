name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/package-release.ps1"
      - "tools/sign.ps1"
      - "ManyCopy.csproj"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected project version, for example 1.1.9 (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release package
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version and commit
        id: metadata
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'ManyCopy.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if (-not $version) {
            throw 'ManyCopy.csproj does not contain a Version value.'
          }

          if ($env:EXPECTED_VERSION -and $env:EXPECTED_VERSION -ne $version) {
            throw "Requested version '$env:EXPECTED_VERSION' does not match project version '$version'."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match project version '$expectedTag'."
            }

            git fetch origin main --no-tags
            $containingBranches = git branch -r --contains $env:GITHUB_SHA
            if ($containingBranches -notmatch 'origin/main') {
              throw "Release tag must point to a commit contained in origin/main."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ManyCopy.csproj
          dotnet restore tests/ManyCopy.Tests/ManyCopy.Tests.csproj

      - name: Build
        shell: pwsh
        run: dotnet build ManyCopy.csproj -c Release --no-restore --nologo

      - name: Test
        shell: pwsh
        run: dotnet test tests/ManyCopy.Tests/ManyCopy.Tests.csproj -c Release --no-restore --nologo

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish ManyCopy.csproj -c Release -r win-x64 --no-restore --nologo

      - name: Sign executable
        id: signing
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_SUBJECT: ${{ secrets.CODESIGN_SUBJECT }}
        run: |
          $isTagRelease = $env:GITHUB_REF_TYPE -eq 'tag'
          $hasSigningSecrets = [bool]$env:CODESIGN_PFX_BASE64 -and [bool]$env:CODESIGN_PFX_PASSWORD

          if (-not $hasSigningSecrets) {
            if ($isTagRelease) {
              throw 'Tag releases require CODESIGN_PFX_BASE64 and CODESIGN_PFX_PASSWORD. No release was published.'
            }

            Write-Warning 'Signing secrets are unavailable. This manual dry run will produce an explicitly unsigned artifact.'
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $publishDirectory = Join-Path $pwd 'bin/Release/net8.0-windows/win-x64/publish'
          $executable = Join-Path $publishDirectory 'ManyCopy.exe'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'manycopy-codesign.pfx'

          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
            $importedCertificates = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $certificate = $importedCertificates |
              Where-Object { $_.HasPrivateKey -and $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3' } |
              Sort-Object NotAfter -Descending |
              Select-Object -First 1
            if (-not $certificate) {
              throw 'The PFX did not contain a code-signing certificate with a private key.'
            }

            $subject = if ($env:CODESIGN_SUBJECT) { $env:CODESIGN_SUBJECT } else { $certificate.Subject }
            & .\tools\sign.ps1 -File $executable -Subject $subject -RequireExistingCertificate

            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($signature.Status -ne 'Valid') {
              throw "Signature verification failed: $($signature.StatusMessage)"
            }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create canonical package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $publishDirectory = Join-Path $pwd 'bin/Release/net8.0-windows/win-x64/publish'
          $artifactDirectory = Join-Path $pwd 'release-artifacts'
          $packageArguments = @{
            PublishDirectory = $publishDirectory
            OutputDirectory = $artifactDirectory
            Version = $env:VERSION
            Unsigned = $env:SIGNED -ne 'true'
          }
          $package = & .\tools\package-release.ps1 @packageArguments

          "package_name=$($package.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$($package.Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload dry-run artifact
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.ref_type == 'tag' && steps.signing.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ManyCopy ${{ steps.metadata.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.package.outputs.package_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
